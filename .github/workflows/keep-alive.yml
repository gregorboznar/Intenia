name: Keep Vercel Warm

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Homepage (Slovenian)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/sl"

      - name: Ping Homepage (English)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/en"

      - name: Ping Homepage (French)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/fr"

      - name: Ping Products Page (English)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/en/products"

      - name: Ping Gallery Page (English)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/en/gallery"

      - name: Warm API - Header Section (EN)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/header-section?lang=en"

      - name: Warm API - Services (EN)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/services?lang=en"

      - name: Warm API - Services Section (EN)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/services-section?lang=en"

      - name: Warm API - New Products (EN)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/new-products?lang=en"

      - name: Warm API - New Products Section (EN)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/new-products-section?lang=en"

      - name: Warm API - Header Section (SL)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/header-section?lang=sl"

      - name: Warm API - Services (SL)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/services?lang=sl"

      - name: Warm API - Services Section (SL)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/services-section?lang=sl"

      - name: Warm API - New Products (SL)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/new-products?lang=sl"

      - name: Warm API - New Products Section (SL)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/new-products-section?lang=sl"

      - name: Warm API - Header Section (FR)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/header-section?lang=fr"

      - name: Warm API - Services (FR)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/services?lang=fr"

      - name: Warm API - Services Section (FR)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/services-section?lang=fr"

      - name: Warm API - New Products (FR)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/new-products?lang=fr"

      - name: Warm API - New Products Section (FR)
        run: |
          curl -L -f -s -o /dev/null -w "HTTP %{http_code}\n" \
          "${{ secrets.VERCEL_URL }}/api/wp/new-products-section?lang=fr"